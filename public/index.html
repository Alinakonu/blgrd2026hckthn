<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriSense — Serbia field check</title>
  <meta name="description" content="Pick a Serbian plot. See if annual rain is hiding a drier summer. Get a crop action plan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e6ede7;
      --ink: #1b2d24;
      --ink-soft: #3e5349;
      --muted: #6a7c72;
      --accent: #2f5f46;
      --accent-ink: #f3faf5;
      --danger: #a84840;
      --warn: #a56b28;
      --rule: rgba(27, 45, 36, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #e6ede7;
      color: var(--ink);
      font-family: Figtree, "Segoe UI", sans-serif;
    }
    body {
      background:
        radial-gradient(1000px 560px at 8% 0%, rgba(180, 210, 190, 0.92), transparent 58%),
        radial-gradient(820px 480px at 92% 8%, rgba(232, 220, 200, 0.45), transparent 55%),
        linear-gradient(180deg, #eef3ef 0%, #e6ede7 55%, #dce6de 100%);
    }
    .shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      max-width: 1180px;
      margin: 0 auto;
      min-height: 100vh;
    }
    aside {
      padding: 1.6rem 1.25rem 2rem;
      border-right: 1px solid var(--rule);
      background: linear-gradient(180deg, rgba(244,247,244,.96), rgba(255,252,248,.88));
    }
    aside h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 2rem;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    aside .cap { color: var(--muted); font-size: 0.82rem; margin: 0.45rem 0 1.2rem; line-height: 1.45; }
    label { display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 0.4rem; }
    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.85);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
    }
    .pitch { margin-top: 1.4rem; font-size: 0.88rem; color: var(--ink-soft); line-height: 1.65; }
    .pitch strong { color: var(--ink); }
    main { padding: 1.75rem 1.6rem 3rem; }
    .headline {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin: 0.35rem 0 1.1rem;
    }
    .place { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
    .card {
      background: linear-gradient(165deg, rgba(255,252,248,.94), rgba(255,255,255,.72));
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 0.95rem 1rem 0.85rem;
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 12px 30px rgba(27,45,36,.06);
    }
    .card .k { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .card .v { font-family: Fraunces, Georgia, serif; font-size: 1.55rem; margin-top: 0.25rem; }
    .card .d { font-size: 0.82rem; margin-top: 0.2rem; color: var(--ink-soft); }
    .d.bad { color: var(--danger); }
    .d.ok { color: var(--accent); }
    .grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1rem; margin-top: 1rem; }
    h2 { font-family: Fraunces, Georgia, serif; font-size: 1.2rem; margin: 0 0 0.35rem; }
    .muted { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.7rem; }
    .bar-row { display: grid; grid-template-columns: 7.5rem 1fr 3.2rem; gap: 0.5rem; align-items: center; margin: 0.45rem 0; font-size: 0.82rem; }
    .bar { height: 10px; background: rgba(27,45,36,.08); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
    .bar > i.hot { background: var(--danger); }
    .sig { list-style: none; }
    .sig li { padding: 0.35rem 0; border-bottom: 1px solid var(--rule); font-size: 0.9rem; color: var(--ink-soft); line-height: 1.4; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 0.6rem; }
    th, td { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--rule); }
    th { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .pill { display: inline-block; padding: 0.12rem 0.55rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; border: 1px solid; }
    .pill.high, .pill.moderate { color: var(--danger); background: rgba(168,72,64,.1); border-color: rgba(168,72,64,.28); }
    .pill.stable, .pill.improving { color: var(--accent); background: rgba(47,95,70,.1); border-color: rgba(47,95,70,.28); }
    .warn, .okbox {
      border-radius: 16px; padding: 0.75rem 0.9rem; margin: 0.6rem 0; font-size: 0.92rem; line-height: 1.45;
    }
    .warn { background: rgba(168,72,64,.08); border: 1px solid rgba(168,72,64,.22); }
    .okbox { background: rgba(47,95,70,.08); border: 1px solid rgba(47,95,70,.22); }
    button {
      background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
      font: inherit; font-weight: 600; padding: 0.55rem 1.2rem; cursor: pointer;
      box-shadow: 0 8px 20px rgba(47,95,70,.18);
    }
    button:hover { background: #264d39; }
    pre.plan {
      white-space: pre-wrap; font-family: Figtree, sans-serif; font-size: 0.92rem;
      line-height: 1.55; color: var(--ink-soft); margin-top: 0.8rem;
    }
    .foot { margin-top: 1.6rem; font-size: 0.78rem; color: var(--muted); }
    .foot a { color: var(--accent); }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--rule); }
      .metrics, .grid2 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .metrics, .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>AgriSense</h1>
      <p class="cap">Serbia field check — measured climate shift, crop exposure, action plan. Not an official forecast.</p>
      <label for="pin">Field</label>
      <select id="pin"></select>
      <p class="pitch">
        <strong>Pitch path</strong><br />
        1. <strong>Novi Sad</strong> — rain gauge looks fine<br />
        2. <strong>Zrenjanin</strong> — worst summer deficit<br />
        3. <strong>Niš</strong> — stable counter-example
      </p>
    </aside>
    <main id="main">Loading field data…</main>
  </div>
  <script>
    const ORDER = ["Novi Sad", "Zrenjanin", "Subotica", "Belgrade", "Kraljevo", "Nis"];
    const SIGNALS = {
      heat_intensifying: "extreme-heat days have increased materially",
      heat_stable: "extreme-heat days are broadly unchanged",
      heat_easing: "extreme-heat days have decreased",
      annual_rainfall_stable: "annual rainfall totals are broadly unchanged",
      annual_rainfall_increasing: "annual rainfall totals have increased",
      annual_rainfall_declining: "annual rainfall totals have decreased",
      crop_water_demand_rising: "reference evapotranspiration has risen, so crops now need more water for the same yield",
      summer_water_deficit_worsening: "the summer rainfall-minus-demand balance has deteriorated",
      summer_water_deficit_stable: "the summer rainfall-minus-demand balance is broadly unchanged",
      summer_water_deficit_easing: "the summer rainfall-minus-demand balance has improved",
      annual_totals_masking_summer_stress:
        "annual rainfall looks fine while the growing season has dried out, so yearly totals would mislead this farmer",
      dry_spells_lengthening: "the typical longest dry spell each year has lengthened",
    };
    const RANK = { low: 1, "low-medium": 2, medium: 3, "medium-high": 4, high: 5 };
    const CROPS = {
      maize: { label: "Maize", kc_mid: 1.2, drought_sensitivity: "medium-high", peak_window: [6, 8], sown_ha_vojvodina: 500759 },
      wheat: { label: "Wheat", kc_mid: 1.15, drought_sensitivity: "low-medium", peak_window: [4, 6], sown_ha_vojvodina: 305412 },
      sunflower: { label: "Sunflower", kc_mid: 1.15, drought_sensitivity: "low-medium", peak_window: [6, 8], sown_ha_vojvodina: 220139 },
      soybean: { label: "Soybean", kc_mid: 1.1, drought_sensitivity: "low-medium", peak_window: [7, 8], sown_ha_vojvodina: 172117 },
      sugar_beet: { label: "Sugar beet", kc_mid: 1.15, drought_sensitivity: "low-medium", peak_window: [6, 9], sown_ha_vojvodina: 31539 },
      sorghum: { label: "Sorghum", kc_mid: 1.1, drought_sensitivity: "low", peak_window: [6, 8], sown_ha_vojvodina: 0 },
    };

    function overlap(win) {
      const months = [];
      for (let m = win[0]; m <= win[1]; m++) months.push(m);
      const hit = months.filter((m) => m >= 6 && m <= 8).length;
      return hit / months.length;
    }
    function band(score) {
      if (score >= 1.5) return "high";
      if (score >= 0.5) return "moderate";
      if (score > -0.5) return "stable";
      return "improving";
    }
    function assess(record) {
      const crops = Object.entries(CROPS).map(([key, crop]) => {
        const gap0 = Math.round(crop.kc_mid * record.baseline.summer_water_demand_mm - record.baseline.summer_rain_mm);
        const gap1 = Math.round(crop.kc_mid * record.recent.summer_water_demand_mm - record.recent.summer_rain_mm);
        const widening = gap1 - gap0;
        const ov = overlap(crop.peak_window);
        const score = Math.round((widening / 50) * (RANK[crop.drought_sensitivity] / 2) * ov * 100) / 100;
        return {
          crop: key, label: crop.label, sown_ha_vojvodina: crop.sown_ha_vojvodina,
          irrigation_gap_baseline_mm: gap0, irrigation_gap_recent_mm: gap1,
          gap_widening_mm: widening, summer_overlap: Math.round(ov * 100) / 100,
          drought_sensitivity: crop.drought_sensitivity, exposure_score: score, exposure_band: band(score),
        };
      }).sort((a, b) => b.exposure_score - a.exposure_score);
      const grown = crops.filter((c) => c.sown_ha_vojvodina > 0);
      const atRisk = grown.filter((c) => c.exposure_band === "high" || c.exposure_band === "moderate");
      const alts = crops.filter((c) => c.sown_ha_vojvodina === 0 && atRisk.length && c.exposure_score < Math.min(...atRisk.map((g) => g.exposure_score)));
      return {
        crops, crops_at_risk: atRisk.map((c) => c.crop), most_exposed: atRisk[0] ? atRisk[0].crop : null,
        adaptation_candidates: alts.map((c) => c.crop),
        verdict: atRisk.length ? "action_needed" : "no_change_indicated",
      };
    }
    function headline(record, a) {
      if ((record.signals || []).includes("annual_totals_masking_summer_stress"))
        return "Annual rainfall looks fine — the summer water deficit is getting worse. That is the problem.";
      if (a.verdict === "action_needed") {
        const label = CROPS[a.most_exposed]?.label || "crops";
        return `Action indicated — ${label} is the most exposed crop at this plot.`;
      }
      return "No material crop-exposure change indicated at this plot.";
    }
    function dlt(a, b) { return Math.round((b - a) * 10) / 10; }
    function bar(val, max, hot) {
      const w = Math.min(100, Math.abs(val) / max * 100);
      return `<div class="bar"><i class="${hot ? "hot" : ""}" style="width:${w}%"></i></div>`;
    }
    function plan(record, a) {
      const loc = record.location.name;
      const b = record.baseline, r = record.recent;
      const lines = ["WHAT CHANGED",
        `At ${loc}, summer water balance moved from ${b.summer_water_balance_mm} mm (${b.period}) to ${r.summer_water_balance_mm} mm (${r.period}) (${dlt(b.summer_water_balance_mm, r.summer_water_balance_mm) >= 0 ? "+" : ""}${dlt(b.summer_water_balance_mm, r.summer_water_balance_mm)} mm). Annual rainfall changed by ${dlt(b.precip_mm, r.precip_mm) >= 0 ? "+" : ""}${dlt(b.precip_mm, r.precip_mm)} mm (${b.precip_mm} → ${r.precip_mm} mm) while summer ET0 rose ${dlt(b.summer_water_demand_mm, r.summer_water_demand_mm) >= 0 ? "+" : ""}${dlt(b.summer_water_demand_mm, r.summer_water_demand_mm)} mm, days ≥30°C rose ${dlt(b.hot_days_30, r.hot_days_30)}, and days ≥35°C rose ${dlt(b.hot_days_35, r.hot_days_35)}.`,
        "", "WHAT IT MEANS FOR YOUR CROPS"];
      if (a.verdict !== "action_needed") {
        lines.push("Crop exposure scores stay in the stable/improving band. Do not force a crop switch from this climate signal alone.");
      } else {
        const bits = a.crops.filter((e) => a.crops_at_risk.includes(e.crop)).slice(0, 4).map(
          (e) => `${e.label} exposure ${e.exposure_band} (irrigation gap ${e.irrigation_gap_baseline_mm} → ${e.irrigation_gap_recent_mm} mm, ${e.gap_widening_mm >= 0 ? "+" : ""}${e.gap_widening_mm} mm)`
        );
        lines.push(bits.join("; ") + ".");
        if (a.adaptation_candidates.length)
          lines.push("Lower-exposure alternatives to consider: " + a.adaptation_candidates.map((k) => CROPS[k].label).join(", ") + ".");
      }
      lines.push("", "WHAT TO DO");
      if (a.verdict === "action_needed") {
        lines.push(
          "1. Before next sowing (Feb–Apr): prioritise water-efficient or shorter-maturity options for the most exposed summer crop — do not pick a brand from this tool.",
          "2. In spring: plan irrigation or mulching for the crop whose peak months overlap Jun–Aug most (see exposure table).",
          "3. This winter: treat annual rainfall totals as misleading if the masking signal is present — track summer rain minus ET0 instead.",
          "4. If adapting rotation: trial a lower-sensitivity summer crop on a strip before a full switch."
        );
      } else {
        lines.push(
          "1. Keep current rotation; re-check this plot after the next hot summer.",
          "2. Still log summer rainfall and irrigation hours — stability can reverse.",
          "3. Use the model range below as context, not as a forecast."
        );
      }
      const o = record.outlook || {};
      lines.push("", "WHAT TO WATCH");
      if (o.hot_days_30_range) {
        lines.push(`Model range for ${o.period}: ${o.hot_days_30_range[0]}–${o.hot_days_30_range[1]} days ≥30°C/year across ${(o.models || []).length} models (${o.confidence || "illustrative range"}). Also watch June–August rainfall versus ET0 each season.`);
      } else {
        lines.push("June–August rainfall versus ET0, and days ≥35°C each summer.");
      }
      lines.push("\nSource: offline plan from pins.json + FAO crop table (no LLM). Figures are measured or FAO-derived.");
      return lines.join("\n");
    }

    let PINS = [];
    function render(name) {
      const record = PINS.find((p) => p.location.name === name);
      if (!record) return;
      const a = assess(record);
      const b = record.baseline, r = record.recent;
      const loc = record.location;
      const balD = dlt(b.summer_water_balance_mm, r.summer_water_balance_mm);
      const rainD = dlt(b.precip_mm, r.precip_mm);
      const etD = dlt(b.summer_water_demand_mm, r.summer_water_demand_mm);
      const hotD = dlt(b.hot_days_30, r.hot_days_30);
      const rainMax = Math.max(b.summer_rain_mm, r.summer_rain_mm, b.summer_water_demand_mm, r.summer_water_demand_mm);
      const heatMax = Math.max(b.hot_days_30, r.hot_days_30, 1);
      const rows = a.crops.map((e) => `<tr>
        <td>${e.label}</td>
        <td><span class="pill ${e.exposure_band}">${e.exposure_band}</span></td>
        <td>${e.exposure_score}</td>
        <td>${e.irrigation_gap_baseline_mm} → ${e.irrigation_gap_recent_mm}</td>
        <td>${e.gap_widening_mm >= 0 ? "+" : ""}${e.gap_widening_mm}</td>
        <td>${e.sown_ha_vojvodina ? e.sown_ha_vojvodina.toLocaleString() : "—"}</td>
      </tr>`).join("");
      const alert = a.verdict === "action_needed"
        ? `<div class="warn">Action needed — at risk: <strong>${a.crops_at_risk.map((k) => CROPS[k].label).join(", ")}</strong>. Most exposed: <strong>${CROPS[a.most_exposed].label}</strong>.</div>`
        : `<div class="okbox">No change indicated — no crop is in the high/moderate exposure band.</div>`;
      const o = record.outlook || {};
      document.getElementById("main").innerHTML = `
        <p class="place">${loc.name} · ${loc.region || "Serbia"}</p>
        <p class="headline">${headline(record, a)}</p>
        <div class="metrics">
          <div class="card"><div class="k">Summer balance</div><div class="v">${r.summer_water_balance_mm} mm</div><div class="d ${balD < 0 ? "bad" : "ok"}">${balD >= 0 ? "+" : ""}${balD} mm vs baseline</div></div>
          <div class="card"><div class="k">Annual rain</div><div class="v">${r.precip_mm} mm</div><div class="d">${rainD >= 0 ? "+" : ""}${rainD} mm</div></div>
          <div class="card"><div class="k">Summer ET0</div><div class="v">${r.summer_water_demand_mm} mm</div><div class="d ${etD > 0 ? "bad" : ""}">${etD >= 0 ? "+" : ""}${etD} mm</div></div>
          <div class="card"><div class="k">Days ≥30°C</div><div class="v">${r.hot_days_30}</div><div class="d ${hotD > 0 ? "bad" : ""}">${hotD >= 0 ? "+" : ""}${hotD}</div></div>
        </div>
        <div class="grid2">
          <div class="card">
            <h2>Your rain gauge can lie</h2>
            <p class="muted">Annual totals may look stable while June–August rainfall minus ET0 worsens.</p>
            <div class="bar-row"><span>Summer rain ${b.period.slice(0,4)}</span>${bar(b.summer_rain_mm, rainMax, false)}<span>${b.summer_rain_mm}</span></div>
            <div class="bar-row"><span>Summer rain ${r.period.slice(0,4)}</span>${bar(r.summer_rain_mm, rainMax, false)}<span>${r.summer_rain_mm}</span></div>
            <div class="bar-row"><span>ET0 demand ${b.period.slice(0,4)}</span>${bar(b.summer_water_demand_mm, rainMax, true)}<span>${b.summer_water_demand_mm}</span></div>
            <div class="bar-row"><span>ET0 demand ${r.period.slice(0,4)}</span>${bar(r.summer_water_demand_mm, rainMax, true)}<span>${r.summer_water_demand_mm}</span></div>
            <h2 style="margin-top:1.1rem">Heat</h2>
            <div class="bar-row"><span>Days ≥30 ${b.period.slice(0,4)}</span>${bar(b.hot_days_30, heatMax, true)}<span>${b.hot_days_30}</span></div>
            <div class="bar-row"><span>Days ≥30 ${r.period.slice(0,4)}</span>${bar(r.hot_days_30, heatMax, true)}<span>${r.hot_days_30}</span></div>
            <div class="bar-row"><span>Days ≥35 ${b.period.slice(0,4)}</span>${bar(b.hot_days_35, heatMax, true)}<span>${b.hot_days_35}</span></div>
            <div class="bar-row"><span>Days ≥35 ${r.period.slice(0,4)}</span>${bar(r.hot_days_35, heatMax, true)}<span>${r.hot_days_35}</span></div>
          </div>
          <div>
            <div class="card">
              <h2>Signals</h2>
              <ul class="sig">${(record.signals || []).map((s) => `<li>${SIGNALS[s] || s}</li>`).join("")}</ul>
            </div>
            ${o.hot_days_30_range ? `<div class="card" style="margin-top:.75rem">
              <h2>Outlook (model range)</h2>
              <p class="muted">${o.period} days ≥30°C: <strong>${o.hot_days_30_range[0]} – ${o.hot_days_30_range[1]}</strong>. Rain ${o.precip_mm_range[0]}–${o.precip_mm_range[1]} mm. <em>${o.confidence || ""}</em></p>
            </div>` : ""}
          </div>
        </div>
        <div class="card" style="margin-top:1rem">
          <h2>Crop exposure (FAO-56)</h2>
          ${alert}
          <table>
            <thead><tr><th>Crop</th><th>Exposure</th><th>Score</th><th>Gap mm</th><th>Widening</th><th>Vojvodina ha</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="card" style="margin-top:1rem">
          <h2>Action plan</h2>
          <p class="muted">Offline plan — figures only from pins.json + FAO crop table.</p>
          <button type="button" id="gen">Generate plan</button>
          <pre class="plan" id="plan" hidden></pre>
        </div>
        <p class="foot">Open-Meteo ERA5 + CMIP6 · FAO Irrigation Manual 3 · SoilGrids unavailable for Europe ·
          Pitch deck (optional): <a href="./deck.html">slides</a>. Full Streamlit app: <code>streamlit run streamlit_app.py</code>.</p>
      `;
      const btn = document.getElementById("gen");
      const pre = document.getElementById("plan");
      btn.addEventListener("click", () => {
        pre.hidden = false;
        pre.textContent = plan(record, a);
      });
    }

    fetch("./data/pins.json")
      .then((r) => {
        if (!r.ok) throw new Error("pins.json " + r.status);
        return r.json();
      })
      .then((pins) => {
        PINS = pins;
        const names = ORDER.filter((n) => pins.some((p) => p.location.name === n));
        const sel = document.getElementById("pin");
        sel.innerHTML = names.map((n) => `<option value="${n}">${n}</option>`).join("");
        sel.addEventListener("change", () => render(sel.value));
        render(names[0] || pins[0].location.name);
      })
      .catch((err) => {
        document.getElementById("main").innerHTML = `<p class="headline">Could not load field data.</p><p>${err.message}</p>`;
      });
  </script>
</body>
</html>
