services:
  - type: web
    name: soilshift
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: USE_FIXTURES
        value: "1"
      - key: HOSTNAME
        value: "0.0.0.0"
